name: Linting

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  pylint:
    runs-on: ubuntu-latest
    name: Pylint Code Quality

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint

      - name: Run Pylint
        run: |
          pylint main.py tests/ --disable=C0111,C0103 || true

  flake8:
    runs-on: ubuntu-latest
    name: Flake8 Style Guide

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8
        run: |
          flake8 main.py tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 main.py tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
